<svg xmlns="http://w3.org" viewBox="0 0 100 125" width="110" height="138" role="img" aria-label="J Compass Logo" style="display: inline-block; background-color: transparent;">
  <!-- Seamless 130° arc at exact R = 19 that completes the J's inner circle -->
  <path
    d="M 37.79 63.45 A 19 19 0 0 1 69 78"
    fill="none"
    stroke="rgba(59, 130, 246, 0.14)"
    stroke-width="2.2"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />

  <!-- Full static J outline -->
  <path
    d="M 69 14 H 86 V 78 A 36 36 0 1 1 26.86 50.42 L 37.79 63.45 A 19 19 0 1 0 69 78 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />

  <!-- Borderless compass needle centered at (50, 78), tilted 30deg and scaled 1.5x -->
  <g transform="translate(50 78) rotate(30) scale(1.8) translate(-50 -78)">
    <!-- Top triangle (Red) -->
    <polygon points="50,62.5 53.4,78 46.6,78" fill="#ef4444" />
    <!-- Bottom triangle (Blue) -->
    <polygon points="50,93.5 53.4,78 46.6,78" fill="#3b82f6" />
    <!-- Center pivot pin -->
    <circle cx="50" cy="78" r="2" fill="#ffffff" />
  </g>
</svg>
