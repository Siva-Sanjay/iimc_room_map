<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campus Room Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Leaflet JS & PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100%; width: 100%; overflow: hidden; }
    
    /* Mobile-optimized Control Box */
    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
    }

    select {
      flex: 1 1 120px;
      background: #fff;
    }

    input {
      flex: 2 1 140px;
    }

    button.search-btn {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      flex: 0 0 auto;
    }

    button.search-btn:active {
      background: #0056b3;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Popup & Directions Button Styling */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 4px;
    }

    .directions-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #28a745;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .directions-btn:active {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>

<div id="controls">
  <select id="buildingFilter">
    <option value="ALL">All Buildings</option>
  </select>
  <input type="text" id="search" placeholder="Enter Room No..." onkeydown="handleKeyPress(event)">
  <button class="search-btn" onclick="performSearch()">Search</button>
</div>

<div id="map"></div>

<script>
  // Google Hybrid View (Satellite + Road/Building Labels)
  const map = L.map('map', {
    zoomControl: false // Prevents zoom buttons from obstructing controls on small mobile screens
  }).setView([22.44645, 88.30245], 19);

  // Position zoom controls in bottom-right for thumb accessibility on phones
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  }).addTo(map);

  // Published Google Sheet CSV URL
  const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMqGQWWtVef47JkjW_yzDHMGSDHibCGHl1alPbr3G_1pzqoY5ojKvxB2Zov8cj2-34BW7I8gGYX4zK/pub?gid=956140635&single=true&output=csv';

  let allRooms = [];
  let activeMarkers = [];

  // Parse CSV Data
  Papa.parse(sheetCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRooms = results.data;
      populateBuildingDropdown();
      clearMarkers();
    }
  });

  function populateBuildingDropdown() {
    const select = document.getElementById('buildingFilter');
    select.innerHTML = '<option value="ALL">All Buildings</option>';

    const buildings = [...new Set(allRooms.map(r => r.Building ? r.Building.trim() : '').filter(Boolean))];
    buildings.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      select.appendChild(opt);
    });
  }

  function clearMarkers() {
    activeMarkers.forEach(m => map.removeLayer(m));
    activeMarkers = [];
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      performSearch();
    }
  }

  function performSearch() {
    clearMarkers();

    const query = document.getElementById('search').value.trim().toLowerCase();
    const selectedBuilding = document.getElementById('buildingFilter').value;

    if (!query) {
      alert("Please enter a room number.");
      return;
    }

    const filtered = allRooms.filter(room => {
      const roomNum = room.Room_Number ? room.Room_Number.toString().trim().toLowerCase() : '';
      const roomName = room.Room_Name ? room.Room_Name.toString().trim().toLowerCase() : '';
      const building = room.Building ? room.Building.trim() : '';

      const matchBuilding = (selectedBuilding === 'ALL' || building === selectedBuilding);
      const matchQuery = roomNum === query || roomNum.includes(query) || roomName.includes(query);

      return matchBuilding && matchQuery;
    });

    if (filtered.length === 0) {
      alert("No matching room found.");
      return;
    }

    const bounds = [];

    filtered.forEach(room => {
      const lat = parseFloat(room.Latitude);
      const lng = parseFloat(room.Longitude);

      if (!isNaN(lat) && !isNaN(lng)) {
        // Universal Google Maps navigation URL using destination coordinates
        const gmapsDirectionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;

        const marker = L.marker([lat, lng])
          .bindPopup(`
            <div style="line-height: 1.4; font-size: 14px;">
              <h3 style="margin: 0 0 6px 0; color: #007bff; font-size: 16px;">${room.Room_Name || 'Room'}</h3>
              <b>Building:</b> ${room.Building}<br>
              <b>Floor:</b> Level ${room.Floor}<br>
              <b>Room No:</b> ${room.Room_Number}<br>
              <a href="${gmapsDirectionsUrl}" target="_blank" class="directions-btn">
                🧭 Get Directions
              </a>
            </div>
          `);

        marker.addTo(map);
        activeMarkers.push(marker);
        bounds.push([lat, lng]);
      }
    });

    // Auto-zoom map to searched room
    if (bounds.length === 1) {
      map.flyTo(bounds[0], 21);
      if (activeMarkers[0]) activeMarkers[0].openPopup();
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [60, 60] });
    }
  }
</script>

</body>
</html>
