<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campus Room Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Leaflet JS & PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }
    
    body, html { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
    }

    /* Fixed Floating Control Card */
    #controls {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: row; /* Horizontal alignment */
      flex-wrap: wrap;    /* Wraps gracefully on mobile screens */
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 500px;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    /* Header Branding Styles - spans full width above inputs */
    .header-branding {
      flex: 1 1 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .header-branding h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .compass-icon {
      font-size: 20px;
      display: inline-block;
    }

    .author-tag {
      font-size: 11px;
      color: #70757a;
      margin: 2px 0 0 0;
      font-weight: 400;
    }

    .author-tag a {
      color: #70757a;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    .author-tag a:hover {
      color: #1a73e8;
    }

    /* Shared dimensions for form controls */
    input, select {
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background: #ffffff;
      box-sizing: border-box;
    }

    /* Dropdown Flex Sizing */
    select#buildingFilter {
      flex: 1 1 120px;
      min-width: 110px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c70757a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
      padding-right: 26px;
    }

    /* Search Input Wrapper Flex Sizing */
    .search-wrapper {
      position: relative;
      flex: 2 1 150px;
      min-width: 130px;
    }

    .search-wrapper input {
      width: 100%;
    }

    /* Compact Magnifying Glass Search Button */
    button.search-btn {
      height: 38px;
      width: 38px;
      min-width: 38px;
      flex: 0 0 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    button.search-btn:active {
      background: #0056b3;
    }

    /* Suggestions Dropdown */
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 1001;
      border: 1px solid #e0e0e0;
      border-top: none;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #202124;
      border-bottom: 1px solid #f1f3f4;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover, .suggestion-item.active {
      background-color: #f8f9fa;
    }

    .room-subtext {
      margin-left: auto;
      font-size: 12px;
      color: #70757a;
    }

    /* Map view adjustments */
    #map {
      height: 100vh;
      width: 100vw;
    }

    .leaflet-container img {
      -webkit-user-drag: none !important;
      user-drag: none !important;
      -webkit-touch-callout: none !important;
      pointer-events: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 4px;
    }

    .directions-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #28a745;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<div id="controls">
  <!-- Page Header Title & Subtitle -->
  <div class="header-branding">
    <h1><span class="compass-icon">🧭</span> Joka Compass</h1>
    <p class="author-tag">By <a href="https://www.linkedin.com/in/r-siva-sanjay/" target="_blank" rel="noopener noreferrer">Siva Sanjay</a></p>
  </div>

  <select id="buildingFilter" onchange="handleBuildingChange()">
    <option value="ALL">All Buildings</option>
  </select>
  
  <div class="search-wrapper">
    <input type="text" id="search" placeholder="Enter Room No..." autocomplete="off" oninput="handleSearchInput()" onkeydown="handleKeyPress(event)" onfocus="handleSearchInput()">
    <div id="suggestionsBox" class="suggestions-box"></div>
  </div>

 <button class="search-btn" onclick="performSearch()">🔍</button>
</div>

<div id="map"></div>

<script>
  // Google Hybrid View (Satellite + Road/Building Labels)
  const map = L.map('map', { zoomControl: false }).setView([22.44645, 88.30245], 19);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  }).addTo(map);

  const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMqGQWWtVef47JkjW_yzDHMGSDHibCGHl1alPbr3G_1pzqoY5ojKvxB2Zov8cj2-34BW7I8gGYX4zK/pub?gid=956140635&single=true&output=csv';

  let allRooms = [];
  let activeMarkers = [];

  Papa.parse(sheetCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRooms = results.data;
      populateBuildingDropdown();
      clearMarkers();
    }
  });

  function populateBuildingDropdown() {
    const select = document.getElementById('buildingFilter');
    select.innerHTML = '<option value="ALL">All Buildings</option>';

    const buildings = [...new Set(allRooms.map(r => r.Building ? r.Building.trim() : '').filter(Boolean))];
    buildings.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      select.appendChild(opt);
    });
  }

  function clearMarkers() {
    activeMarkers.forEach(m => map.removeLayer(m));
    activeMarkers = [];
  }

  function normalizeText(text) {
    return text ? text.toString().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
  }

 function handleBuildingChange() {
  const selectedBuilding = document.getElementById('buildingFilter').value;

  // Don't do anything if no specific building or default option is selected
  if (!selectedBuilding || selectedBuilding === "") return;

  const freshCsvUrl = sheetCsvUrl + '&t=' + new Date().getTime();
  const buildingPoints = [];

  Papa.parse(freshCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    // Step executes row-by-row, keeping memory footprint minimal
    step: function(row) {
      const room = row.data;
      
      // Check if current row matches the selected building (or ALL)
      if (selectedBuilding === "ALL" || room.Building === selectedBuilding) {
        const lat = parseFloat(room.Latitude);
        const lng = parseFloat(room.Longitude);

        if (!isNaN(lat) && !isNaN(lng)) {
          buildingPoints.push([lat, lng]);
        }
      }
    },
    complete: function() {
      // Once CSV reading finishes, calculate bounds directly from collected points
      if (buildingPoints.length > 0) {
        const bounds = L.latLngBounds(buildingPoints);

      const flyOptions = {
          padding: selectedBuilding === "ALL" ? [40, 40] : [30, 30],
          maxZoom: 19,
          duration: 1.5, // Animation duration in seconds (adjust to speed up/slow down)
          easeLinearity: 0.25 // Smooth curve transition
        };

        // Smoothly slide/fly to the bounding box
        map.flyToBounds(bounds, flyOptions);
      }
    }
  });
}

 function handleSearchInput() {
    const selectedBuilding = document.getElementById('buildingFilter').value;
    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const box = document.getElementById('suggestionsBox');

    // // Only show suggestions when a specific building is selected
    // if (selectedBuilding === 'ALL') {
    //   hideSuggestions();
    //   return;
    // }

   const buildingRooms = allRooms.filter(r => {
  if (!r.Building) return false;
  return selectedBuilding === 'ALL' || r.Building.trim() === selectedBuilding;
});  
    // Filter rooms based on query, or show all rooms for the building if search bar is empty
    const matches = buildingRooms.filter(r => {
      if (!cleanQuery) return true;
      const roomNum = normalizeText(r.Room_Number);
      const roomName = normalizeText(r.Room_Name);
      return roomNum.includes(cleanQuery) || roomName.includes(cleanQuery);
    });

    if (matches.length === 0) {
      hideSuggestions();
      return;
    }

    box.innerHTML = '';
    matches.forEach(room => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      
      const buildingName = room.Building ? room.Building.trim() : '';

      item.innerHTML = `
       
        <span><b>${room.Room_Number}</b></span>
        ${buildingName ? `<span class="room-subtext">${buildingName}</span>` : ''}
      `;
      
      // Select option on click/tap
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        document.getElementById('search').value = room.Room_Number;
        hideSuggestions();
        performSearch();
      });

      box.appendChild(item);
    });

    box.style.display = 'block';
  }
  function hideSuggestions() {
    document.getElementById('suggestionsBox').style.display = 'none';
  }

  // Hide suggestions when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
      hideSuggestions();
    }
  });

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      hideSuggestions();
      performSearch();
    }
  }

  function performSearch() {
    clearMarkers();
    hideSuggestions();

    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const selectedBuilding = document.getElementById('buildingFilter').value;

    if (!cleanQuery) {
      alert("Please enter a room number.");
      return;
    }

    const filtered = allRooms.filter(room => {
      const cleanRoomNum = normalizeText(room.Room_Number);
      const cleanRoomName = normalizeText(room.Room_Name);
      const building = room.Building ? room.Building.trim() : '';

      const matchBuilding = (selectedBuilding === 'ALL' || building === selectedBuilding);
      const matchQuery = cleanRoomNum.includes(cleanQuery) || cleanRoomName.includes(cleanQuery);

      return matchBuilding && matchQuery;
    });

    if (filtered.length === 0) {
      alert("No matching room found.");
      return;
    }

    const bounds = [];

    filtered.forEach(room => {
      const lat = parseFloat(room.Latitude);
      const lng = parseFloat(room.Longitude);

      if (!isNaN(lat) && !isNaN(lng)) {
        const gmapsDirectionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;

        const marker = L.marker([lat, lng])
          .bindPopup(`
            <div style="line-height: 1.4; font-size: 14px;">
              <h3 style="margin: 0 0 6px 0; color: #007bff; font-size: 16px;">${room.Room_Name || 'Room'}</h3>
              <b>Building:</b> ${room.Building}<br>
              <b>Floor:</b>  ${room.Floor}<br>
              <b>Room No:</b> ${room.Room_Number}<br>
              <a href="${gmapsDirectionsUrl}" target="_blank" class="directions-btn">
                🧭 Get Directions
              </a>
            </div>
          `);

        marker.addTo(map);
        activeMarkers.push(marker);
        bounds.push([lat, lng]);
      }
    });

    if (bounds.length === 1) {
      map.flyTo(bounds[0], 21);
      if (activeMarkers[0]) activeMarkers[0].openPopup();
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [60, 60] });
    }
  }
</script>

</body>
</html>
