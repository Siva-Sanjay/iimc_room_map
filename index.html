<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Open Graph / WhatsApp Link Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://joka-compass.vercel.app/" />
  <meta property="og:title" content="Joka Compass" />
  <meta property="og:description" content="Campus Room Map & Navigation for IIM Calcutta" />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/7/7e/Compass_rose_transparent.png" />
  <meta property="og:image:type" content="image/png" />

  <!-- Twitter / X Link Preview -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Joka Compass" />
  <meta name="twitter:description" content="Campus Room Map & Navigation for IIM Calcutta" />
  <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/7/7e/Compass_rose_transparent.png" />

  <title>Joka Compass</title>

  <!-- Compass Emoji Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Leaflet JS & PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <!-- Vercel Web Analytics for Vanilla HTML -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }
    
    body, html { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
    }

    /* Fixed Floating Control Card */
    #controls {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: row; /* Horizontal alignment */
      flex-wrap: wrap;    /* Wraps gracefully on mobile screens */
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 500px;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    /* Header Branding Styles - spans full width above inputs */
    .header-branding {
      flex: 1 1 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .header-branding h1 {
      font-size: 20px;
      font-weight: 700;
      color: #4d1a22;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .compass-icon {
      font-size: 20px;
      display: inline-block;
    }

    .author-tag {
      font-size: 11px;
      color: #70757a;
      margin: 2px 0 0 0;
      font-weight: 400;
    }

    .author-tag a {
      color: #70757a;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    .author-tag a:hover {
      color: #1a73e8;
    }

    /* Shared dimensions for form controls */
    input, select {
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background: #ffffff;
      box-sizing: border-box;
    }

    /* Search Input Wrapper Flex Sizing */
    .search-wrapper {
      position: relative;
      flex: 2 1 150px;
      min-width: 130px;
    }

    .search-wrapper input {
      width: 100%;
    }

    /* Compact Magnifying Glass Search Button */
    button.search-btn {
      height: 38px;
      width: 38px;
      min-width: 38px;
      flex: 0 0 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4d1a22;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    button.search-btn:active {
      background: #0056b3;
    }

    /* Suggestions Dropdown */
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 1001;
      border: 1px solid #e0e0e0;
      border-top: none;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #202124;
      border-bottom: 1px solid #f1f3f4;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover, .suggestion-item.active {
      background-color: #f8f9fa;
    }

    .room-subtext {
      margin-left: auto;
      font-size: 12px;
      color: #70757a;
    }

    /* Map view adjustments */
    #map {
      height: 100vh;
      width: 100vw;
    }

    .leaflet-container img {
      -webkit-user-drag: none !important;
      user-drag: none !important;
      -webkit-touch-callout: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 4px;
    }

    /* Explicitly enable pointer events for map marker pins */
    .leaflet-marker-icon {
      pointer-events: auto !important;
      cursor: pointer !important;
    }

    .directions-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #28a745;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Dropdown Styling with Down Arrow Chevron */
    select#buildingFilter {
      flex: 1 1 120px;
      min-width: 110px;
      height: 38px;
      padding: 0 28px 0 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      background-color: #ffffff;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2370757a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
      background-repeat: no-repeat !important;
      background-position: right 8px center !important;
      background-size: 16px 16px !important;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="controls">
  <!-- Page Header Title & Subtitle -->
  <div class="header-branding">
    <h1><span class="compass-icon">🧭</span> Joka Compass</h1>
    <p class="author-tag">By <a href="https://www.linkedin.com/in/r-siva-sanjay/" target="_blank" rel="noopener noreferrer">Siva Sanjay</a></p>
  </div>

  <select id="buildingFilter" onchange="handleBuildingChange()">
    <option value="ALL">All Buildings</option>
  </select>
  
  <div class="search-wrapper">
    <input type="text" id="search" placeholder="Enter Room No..." autocomplete="off" oninput="handleSearchInput()" onkeydown="handleKeyPress(event)" onfocus="handleSearchInput()">
    <div id="suggestionsBox" class="suggestions-box"></div>
  </div>

  <button class="search-btn" onclick="performSearch()" aria-label="Search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </button>
</div>

<div id="map"></div>

<script>
  // Initialize Leaflet Map
  const map = L.map('map', { zoomControl: false }).setView([22.44645, 88.30245], 19);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 1. Pure Satellite Base (No labels, no white overlay)
  const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  });

  // 2. Transparent Hybrid Overlay (Roads & Area Names only, POI icons hidden)
  const googleHybridNoPOI = L.tileLayer('https://{s}.google.com/vt/lyrs=h&apistyle=s.t:3|p.v:off&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  });

  // Add clean map layers
  googleSat.addTo(map);
  googleHybridNoPOI.addTo(map);
  
  const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMqGQWWtVef47JkjW_yzDHMGSDHibCGHl1alPbr3G_1pzqoY5ojKvxB2Zov8cj2-34BW7I8gGYX4zK/pub?gid=956140635&single=true&output=csv';

  let allRooms = [];
  let activeMarkers = [];

  Papa.parse(sheetCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRooms = results.data;
      populateBuildingDropdown();
      clearMarkers();
      checkUrlSearchParam(); // Process shared URL parameter on load
    }
  });

  function populateBuildingDropdown() {
    const select = document.getElementById('buildingFilter');
    select.innerHTML = '<option value="ALL">All Buildings</option>';

    const buildings = [...new Set(allRooms.map(r => r.Building ? r.Building.trim() : '').filter(Boolean))];
    buildings.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      select.appendChild(opt);
    });
  }

  function clearMarkers() {
    activeMarkers.forEach(m => map.removeLayer(m));
    activeMarkers = [];
  }

  function normalizeText(text) {
    return text ? text.toString().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
  }

  // Reset browser address bar back to clean homepage URL
  function resetUrlToHome() {
    const cleanUrl = `${window.location.origin}${window.location.pathname}`;
    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
  }

  // Check and execute search if ?room= exists in URL on initial page load
  function checkUrlSearchParam() {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');

    if (roomParam) {
      const searchInput = document.getElementById('search');
      if (searchInput) {
        searchInput.value = roomParam;
        performSearch(true);
      }
    }
  }

  function handleBuildingChange() {
    const selectedBuilding = document.getElementById('buildingFilter').value;
    if (!selectedBuilding || selectedBuilding === "") return;

    const freshCsvUrl = sheetCsvUrl + '&t=' + new Date().getTime();
    const buildingPoints = [];

    Papa.parse(freshCsvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      step: function(row) {
        const room = row.data;
        if (selectedBuilding === "ALL" || room.Building === selectedBuilding) {
          const lat = parseFloat(room.Latitude);
          const lng = parseFloat(room.Longitude);
          if (!isNaN(lat) && !isNaN(lng)) {
            buildingPoints.push([lat, lng]);
          }
        }
      },
      complete: function() {
        if (buildingPoints.length > 0) {
          const bounds = L.latLngBounds(buildingPoints);
          const flyOptions = {
            padding: selectedBuilding === "ALL" ? [40, 40] : [30, 30],
            maxZoom: 19,
            duration: 1.5,
            easeLinearity: 0.25
          };
          map.flyToBounds(bounds, flyOptions);
        }
      }
    });
  }

  function handleSearchInput() {
    const selectedBuilding = document.getElementById('buildingFilter').value;
    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const box = document.getElementById('suggestionsBox');

    const buildingRooms = allRooms.filter(r => {
      if (!r.Building) return false;
      return selectedBuilding === 'ALL' || r.Building.trim() === selectedBuilding;
    });  

    const matches = buildingRooms.filter(r => {
      if (!cleanQuery) return true;
      const roomNum = normalizeText(r.Room_Number || r['Room Number']);
      const roomName = normalizeText(r.Room_Name);
      const roomId = normalizeText(r.Room_ID);
      return roomNum.includes(cleanQuery) || roomName.includes(cleanQuery) || roomId.includes(cleanQuery);
    });

    if (matches.length === 0) {
      hideSuggestions();
      return;
    }

    box.innerHTML = '';
    matches.forEach(room => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      
      const buildingName = room.Building ? room.Building.trim() : '';
      const displayRoomNum = room.Room_Number || room['Room Number'] || room.Room_ID || '';

      item.innerHTML = `
        <span><b>${displayRoomNum}</b></span>
        ${buildingName ? `<span class="room-subtext">${buildingName}</span>` : ''}
      `;
      
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const searchInput = document.getElementById('search');
        searchInput.value = room.Room_ID || displayRoomNum;
        searchInput.blur();
        hideSuggestions();
        performSearch();
      });

      box.appendChild(item);
    });

    box.style.display = 'block';
  }

  function hideSuggestions() {
    document.getElementById('suggestionsBox').style.display = 'none';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
      hideSuggestions();
    }
  });

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      hideSuggestions();
      performSearch();
    }
  }

  function performSearch(fromUrl = false) {
    const searchInput = document.getElementById('search');
    if (searchInput) {
      searchInput.blur();
    }

    clearMarkers();
    hideSuggestions();

    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const selectedBuilding = document.getElementById('buildingFilter').value;

    if (!cleanQuery) {
      alert("Please enter a room number.");
      resetUrlToHome();
      return;
    }

    const filtered = allRooms.filter(room => {
      const cleanRoomNum = normalizeText(room.Room_Number || room['Room Number']);
      const cleanRoomName = normalizeText(room.Room_Name);
      const cleanRoomId = normalizeText(room.Room_ID);
      const building = room.Building ? room.Building.trim() : '';

      const matchBuilding = (selectedBuilding === 'ALL' || building === selectedBuilding);
      const matchQuery = cleanRoomNum.includes(cleanQuery) || cleanRoomName.includes(cleanQuery) || cleanRoomId === cleanQuery;

      return matchBuilding && matchQuery;
    });

    if (filtered.length === 0) {
      alert("No matching room found.");
      resetUrlToHome();
      return;
    }

    const bounds = [];

    filtered.forEach(room => {
      const lat = parseFloat(room.Latitude);
      const lng = parseFloat(room.Longitude);

      if (!isNaN(lat) && !isNaN(lng)) {
        const gmapsDirectionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
        const roomNo = room.Room_Number || room['Room Number'] || room.Room_No || room.Room || '';

        const marker = L.marker([lat, lng], { interactive: true });

        const popupContent = `
          <div style="line-height: 1.4; font-size: 14px;">
            <h3 style="margin: 0 0 6px 0; color: #4d1a22; font-size: 16px;">${room.Room_Name || 'Room'}</h3>
            <b>Building:</b> ${room.Building}<br>
            <b>Floor:</b> ${room.Floor}<br>
            <b>Room No:</b> ${roomNo}<br>
            <a href="${gmapsDirectionsUrl}" target="_blank" class="directions-btn">
              🧭 Get Directions
            </a>
          </div>
        `;

        marker.bindPopup(popupContent, { autoPan: true });
        marker.addTo(map);
        activeMarkers.push(marker);
        bounds.push([lat, lng]);
      }
    });

    if (bounds.length === 1) {
      map.flyTo(bounds[0], 21);
      if (activeMarkers[0]) activeMarkers[0].openPopup();
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [60, 60] });
    }

    // Sync URL address bar using Room_ID column value from CSV
    const targetRoomId = filtered[0].Room_ID || rawQuery;
    const newUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(targetRoomId)}`;
    window.history.replaceState({ path: newUrl }, '', newUrl);
  }
</script>

</body>
</html>
