<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Open Graph / WhatsApp Link Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://joka-compass.vercel.app/" />
  <meta property="og:title" content="Joka Compass" />
  <meta property="og:description" content="Campus Room Map & Navigation for IIM Calcutta" />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/7/7e/Compass_rose_transparent.png" />
  <meta property="og:image:type" content="image/png" />

  <!-- Twitter / X Link Preview -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Joka Compass" />
  <meta name="twitter:description" content="Campus Room Map & Navigation for IIM Calcutta" />
  <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/7/7e/Compass_rose_transparent.png" />

  <title>Joka Compass</title>

  <!-- Compass Emoji Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Leaflet JS & PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <!-- Vercel Web Analytics for Vanilla HTML -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }
    
    body, html { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background-color: #f2f2f7;
    }

    /* Fixed Floating Control Card - Apple Modern Minimalist Style */
    #controls {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 14px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 10px;
      width: calc(100% - 32px);
      max-width: 500px;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header-branding {
      flex: 1 1 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .header-branding h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #1c1c1e;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .compass-icon {
      font-size: 22px;
      display: inline-block;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .author-tag {
      font-size: 12px;
      color: #8e8e93;
      margin: 2px 0 0 0;
      font-weight: 400;
      letter-spacing: -0.1px;
    }

    .author-tag a {
      color: #007aff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .author-tag a:hover {
      text-decoration: underline;
    }

    input, select {
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(239, 239, 244, 0.7);
      color: #1c1c1e;
      box-sizing: border-box;
      transition: all 0.2s ease;
      font-weight: 400;
    }

    input:focus, select:focus {
      background: #ffffff;
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .search-wrapper {
      position: relative;
      flex: 2 1 150px;
      min-width: 130px;
    }

    .search-wrapper input {
      width: 100%;
    }

    button.search-btn {
      height: 40px;
      width: 40px;
      min-width: 40px;
      flex: 0 0 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c1c1e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    button.search-btn:hover {
      background: #2c2c2e;
      transform: translateY(-1px);
    }

    button.search-btn:active {
      transform: scale(0.96);
      background: #000000;
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 1001;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 4px;
    }

    .suggestion-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #1c1c1e;
      transition: background 0.15s ease;
    }

    .suggestion-item:hover, .suggestion-item.active {
      background-color: rgba(0, 122, 255, 0.08);
      color: #007aff;
    }

    .room-subtext {
      margin-left: auto;
      font-size: 12px;
      color: #8e8e93;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .leaflet-container img {
      -webkit-user-drag: none !important;
      user-drag: none !important;
      -webkit-touch-callout: none !important;
    }

    .leaflet-marker-icon {
      pointer-events: auto !important;
      cursor: pointer !important;
    }

    /* Leaflet Popup Apple-Style Overrides */
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border-radius: 20px !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0,0,0,0.06) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 16px 18px !important;
      line-height: 1.4 !important;
    }

    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      box-shadow: none !important;
    }

    .leaflet-container a.leaflet-popup-close-button {
      top: 12px !important;
      right: 12px !important;
      color: #8e8e93 !important;
      padding: 4px !important;
      width: 22px !important;
      height: 22px !important;
      border-radius: 50% !important;
      background: rgba(0, 0, 0, 0.05) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 14px !important;
      transition: all 0.2s ease !important;
    }

    .leaflet-container a.leaflet-popup-close-button:hover {
      background: rgba(0, 0, 0, 0.1) !important;
      color: #1c1c1e !important;
    }

    /* Apple Minimalist Card Content */
    .apple-card-title {
      font-size: 18px;
      font-weight: 700;
      color: #1c1c1e;
      margin: 0 0 12px 0;
      letter-spacing: -0.4px;
    }

    .apple-details-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .apple-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .apple-detail-label {
      color: #8e8e93;
      font-weight: 400;
    }

    .apple-detail-value {
      color: #1c1c1e;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.04);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .popup-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      align-items: center;
    }

    .directions-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background-color: #007aff;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .directions-btn:hover {
      background-color: #0062cc;
      transform: translateY(-1px);
    }

    .copy-url-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background-color: rgba(116, 116, 128, 0.12);
      color: #007aff;
      border: none;
      font-weight: 600;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .copy-url-btn:hover {
      background-color: rgba(116, 116, 128, 0.2);
    }

    .copy-url-btn:active {
      transform: scale(0.97);
    }

    select#buildingFilter {
      flex: 1 1 120px;
      min-width: 110px;
      height: 40px;
      padding: 0 28px 0 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
      background-repeat: no-repeat !important;
      background-position: right 10px center !important;
      background-size: 14px 14px !important;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="controls">
  <div class="header-branding">
    <h1><span class="compass-icon">🧭</span> Joka Compass</h1>
    <p class="author-tag">By <a href="https://www.linkedin.com/in/r-siva-sanjay/" target="_blank" rel="noopener noreferrer">Siva Sanjay</a></p>
  </div>

  <select id="buildingFilter" onchange="handleBuildingChange()">
    <option value="ALL">All Buildings</option>
  </select>
  
  <div class="search-wrapper">
    <input type="text" id="search" placeholder="Enter Room No..." autocomplete="off" oninput="handleSearchInput()" onkeydown="handleKeyPress(event)" onfocus="handleSearchInput()">
    <div id="suggestionsBox" class="suggestions-box"></div>
  </div>

  <button class="search-btn" onclick="performSearch()" aria-label="Search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </button>
</div>

<div id="map"></div>

<script>
  // Initialize Leaflet Map
  const map = L.map('map', { zoomControl: false }).setView([22.44645, 88.30245], 19);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  });

  const googleHybridNoPOI = L.tileLayer('https://{s}.google.com/vt/lyrs=h&apistyle=s.t:3|p.v:off&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
  });

  googleSat.addTo(map);
  googleHybridNoPOI.addTo(map);
  
  const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMqGQWWtVef47JkjW_yzDHMGSDHibCGHl1alPbr3G_1pzqoY5ojKvxB2Zov8cj2-34BW7I8gGYX4zK/pub?gid=956140635&single=true&output=csv';

  let allRooms = [];
  let activeMarkers = [];

  Papa.parse(sheetCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRooms = results.data;
      populateBuildingDropdown();
      clearMarkers();
      checkUrlSearchParam();
    }
  });

  function populateBuildingDropdown() {
    const select = document.getElementById('buildingFilter');
    select.innerHTML = '<option value="ALL">All Buildings</option>';

    const buildings = [...new Set(allRooms.map(r => r.Building ? r.Building.trim() : '').filter(Boolean))];
    buildings.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      select.appendChild(opt);
    });
  }

  function clearMarkers() {
    activeMarkers.forEach(m => map.removeLayer(m));
    activeMarkers = [];
  }

  function normalizeText(text) {
    return text ? text.toString().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
  }

  function resetUrlToHome() {
    const cleanUrl = `${window.location.origin}${window.location.pathname}`;
    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
  }

  function copyRoomUrl(btn, roomId) {
    const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl).then(() => {
        showCopyFeedback(btn);
      }).catch(() => {
        fallbackCopyText(shareUrl, btn);
      });
    } else {
      fallbackCopyText(shareUrl, btn);
    }
  }

  function fallbackCopyText(text, btn) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showCopyFeedback(btn);
    } catch (err) {
      prompt("Copy this link:", text);
    }
    document.body.removeChild(textArea);
  }

  function showCopyFeedback(btn) {
    const originalText = btn.innerHTML;
    btn.innerHTML = "✓ Copied";
    btn.style.backgroundColor = "rgba(52, 199, 89, 0.15)";
    btn.style.color = "#34c759";
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.style.backgroundColor = "rgba(116, 116, 128, 0.12)";
      btn.style.color = "#007aff";
    }, 2000);
  }

  function checkUrlSearchParam() {
    // Reset back to home view if user explicitly REFRESHES the page
    const navEntries = performance.getEntriesByType('navigation');
    if (navEntries.length > 0 && navEntries[0].type === 'reload') {
      resetUrlToHome();
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');

    if (roomParam) {
      const searchInput = document.getElementById('search');
      if (searchInput) {
        const cleanParam = normalizeText(roomParam);
        
        const matchedRoom = allRooms.find(r => 
          normalizeText(r.Room_ID) === cleanParam || 
          normalizeText(r.Room_Number || r['Room Number']) === cleanParam
        );

        if (matchedRoom) {
          searchInput.value = matchedRoom.Room_Number || matchedRoom['Room Number'] || roomParam;
          performSearch(false, matchedRoom);
        } else {
          searchInput.value = roomParam;
          performSearch();
        }
      }
    }
  }

  function handleBuildingChange() {
    const selectedBuilding = document.getElementById('buildingFilter').value;
    if (!selectedBuilding || selectedBuilding === "") return;

    const freshCsvUrl = sheetCsvUrl + '&t=' + new Date().getTime();
    const buildingPoints = [];

    Papa.parse(freshCsvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      step: function(row) {
        const room = row.data;
        if (selectedBuilding === "ALL" || room.Building === selectedBuilding) {
          const lat = parseFloat(room.Latitude);
          const lng = parseFloat(room.Longitude);
          if (!isNaN(lat) && !isNaN(lng)) {
            buildingPoints.push([lat, lng]);
          }
        }
      },
      complete: function() {
        if (buildingPoints.length > 0) {
          const bounds = L.latLngBounds(buildingPoints);
          const flyOptions = {
            padding: selectedBuilding === "ALL" ? [40, 40] : [30, 30],
            maxZoom: 19,
            duration: 1.5,
            easeLinearity: 0.25
          };
          map.flyToBounds(bounds, flyOptions);
        }
      }
    });
  }

  function handleSearchInput() {
    const selectedBuilding = document.getElementById('buildingFilter').value;
    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const box = document.getElementById('suggestionsBox');

    const buildingRooms = allRooms.filter(r => {
      if (!r.Building) return false;
      return selectedBuilding === 'ALL' || r.Building.trim() === selectedBuilding;
    });  

    const matches = buildingRooms.filter(r => {
      if (!cleanQuery) return true;
      const roomNum = normalizeText(r.Room_Number || r['Room Number']);
      const roomName = normalizeText(r.Room_Name);
      const roomId = normalizeText(r.Room_ID);
      return roomNum.includes(cleanQuery) || roomName.includes(cleanQuery) || roomId.includes(cleanQuery);
    });

    if (matches.length === 0) {
      hideSuggestions();
      return;
    }

    box.innerHTML = '';
    matches.forEach(room => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      
      const buildingName = room.Building ? room.Building.trim() : '';
      const displayRoomNum = room.Room_Number || room['Room Number'] || '';

      item.innerHTML = `
        <span><b>${displayRoomNum}</b></span>
        ${buildingName ? `<span class="room-subtext">${buildingName}</span>` : ''}
      `;
      
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const searchInput = document.getElementById('search');
        searchInput.value = displayRoomNum;
        searchInput.blur();
        hideSuggestions();
        performSearch(false, room);
      });

      box.appendChild(item);
    });

    box.style.display = 'block';
  }

  function hideSuggestions() {
    document.getElementById('suggestionsBox').style.display = 'none';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
      hideSuggestions();
    }
  });

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      hideSuggestions();
      performSearch();
    }
  }

  function performSearch(fromUrl = false, targetRoom = null) {
    const searchInput = document.getElementById('search');
    if (searchInput) {
      searchInput.blur();
    }

    clearMarkers();
    hideSuggestions();

    const rawQuery = document.getElementById('search').value.trim();
    const cleanQuery = normalizeText(rawQuery);
    const selectedBuilding = document.getElementById('buildingFilter').value;

    let filtered = [];

    if (targetRoom) {
      filtered = [targetRoom];
    } else {
      if (!cleanQuery) {
        alert("Please enter a room number.");
        resetUrlToHome();
        return;
      }

      filtered = allRooms.filter(room => {
        const cleanRoomNum = normalizeText(room.Room_Number || room['Room Number']);
        const cleanRoomName = normalizeText(room.Room_Name);
        const cleanRoomId = normalizeText(room.Room_ID);
        const building = room.Building ? room.Building.trim() : '';

        const matchBuilding = (selectedBuilding === 'ALL' || building === selectedBuilding);
        const matchQuery = cleanRoomNum === cleanQuery || cleanRoomName.includes(cleanQuery) || cleanRoomId === cleanQuery;

        return matchBuilding && matchQuery;
      });
    }

    if (filtered.length === 0) {
      alert("No matching room found.");
      resetUrlToHome();
      return;
    }

    const bounds = [];

    filtered.forEach(room => {
      const lat = parseFloat(room.Latitude);
      const lng = parseFloat(room.Longitude);

      if (!isNaN(lat) && !isNaN(lng)) {
        const gmapsDirectionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
        const roomNo = room.Room_Number || room['Room Number'] || room.Room_No || room.Room || '';
        const roomId = room.Room_ID || roomNo;

        const marker = L.marker([lat, lng], { interactive: true });

        const popupContent = `
          <div>
            <h3 class="apple-card-title">${room.Room_Name || 'Room Details'}</h3>
            <div class="apple-details-list">
              <div class="apple-detail-row">
                <span class="apple-detail-label">Building</span>
                <span class="apple-detail-value">${room.Building || 'N/A'}</span>
              </div>
              <div class="apple-detail-row">
                <span class="apple-detail-label">Floor</span>
                <span class="apple-detail-value">${room.Floor || 'N/A'}</span>
              </div>
              <div class="apple-detail-row">
                <span class="apple-detail-label">Room No</span>
                <span class="apple-detail-value">${roomNo}</span>
              </div>
            </div>
            <div class="popup-actions">
              <a href="${gmapsDirectionsUrl}" target="_blank" class="directions-btn">
                📍 Open GMaps
              </a>
              <button class="copy-url-btn" onclick="copyRoomUrl(this, '${roomId}')">
                🔗 Share Link
              </button>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent, { autoPan: true });
        marker.addTo(map);
        activeMarkers.push(marker);
        bounds.push([lat, lng]);
      }
    });

    if (bounds.length === 1) {
      map.flyTo(bounds[0], 21);
      if (activeMarkers[0]) activeMarkers[0].openPopup();
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [60, 60] });
    }

    const targetRoomId = filtered[0].Room_ID || rawQuery;
    const newUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(targetRoomId)}`;
    window.history.replaceState({ path: newUrl }, '', newUrl);
  }
</script>

</body>
</html>
